<style>
/* Layout: one column of three plain steps (days, gates, download) with a scaled preview of the pages underneath. The printed sheet is paper and keeps its own fixed colors in both themes. */
:root{
  --bg:#F6F6F3; --fg:#1A1D22; --mute:#5A6068; --line:#D9D8D1; --card:#FFFFFF;
  --accent:#1F3A5F; --on-accent:#FFFFFF; --tint:#E7EDF5; --warn:#9A3412; --ok:#166534;
  --display:'Archivo','Arial Narrow',Arial,sans-serif; --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161A; --fg:#ECEBE6; --mute:#9FA4AC; --line:#2E3239; --card:#1A1D22;
  --accent:#8FB4E3; --on-accent:#10141A; --tint:#1A2431; --warn:#FDBA74; --ok:#86EFAC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161A; --fg:#ECEBE6; --mute:#9FA4AC; --line:#2E3239; --card:#1A1D22;
  --accent:#8FB4E3; --on-accent:#10141A; --tint:#1A2431; --warn:#FDBA74; --ok:#86EFAC; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
h1{font-family:var(--display);font-stretch:86%;font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.02;margin:6px 0 8px;color:var(--accent);text-wrap:balance}
.lede{margin:0;color:var(--mute);max-width:60ch}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.step h2{margin:0;font-family:var(--display);font-stretch:92%;font-size:19px;font-weight:750;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.step h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:650;font-size:14.5px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.dates{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label{font-weight:650;font-size:14px}
input[type=date],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;min-width:0}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:440px){.gates{grid-template-columns:1fr}}
.g{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-weight:600}
.g input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.g small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.links{display:flex;gap:14px}
.lk{font:inherit;font-size:14px;font-weight:650;background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer;text-decoration:underline}
.sum{display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-stretch:90%;font-weight:800;font-size:22px}
.heads{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.heads li{font-size:14px;padding:8px 10px;border-left:4px solid var(--accent);background:var(--tint);border-radius:0 6px 6px 0}
.heads li.w{border-color:var(--warn)}
.btn{font:inherit;font-weight:750;font-size:17px;border-radius:9px;padding:14px 18px;border:2px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.msg{margin:0;font-size:14px;color:var(--mute)}
.msg.e{color:var(--warn);font-weight:650}
.msg.o{color:var(--ok);font-weight:650}
.prev{display:flex;flex-direction:column;gap:16px}
.pv{display:flex;flex-direction:column;gap:6px}
.pv>span{font-size:13px;color:var(--mute);font-weight:600}
.pvw{overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#fff;width:100%;max-width:340px}
.pvi{transform-origin:top left}
.rd{display:flex;flex-direction:column;gap:12px}
.rd img{width:100%;max-width:420px;border:1px solid var(--line);border-radius:4px}

/* ---- the printed sheet: fixed paper colors, same in both themes ---- */
.sheet{--paper:#FFFFFF;--ink:#111111;--navy:#1F3A5F;--red:#B91C1C;
  width:794px;height:1123px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;
  font-family:'Archivo','Noto Sans Gujarati',Arial,sans-serif;padding:40px 46px 34px;display:flex;flex-direction:column;gap:14px}
.sh{border-bottom:5px solid var(--navy);padding-bottom:10px;display:flex;flex-direction:column;gap:2px}
.sh .t1{font-size:64px;font-weight:900;font-stretch:90%;line-height:1;color:var(--navy);text-transform:uppercase}
.sh .t2{font-family:'Noto Sans Gujarati',sans-serif;font-size:42px;font-weight:800;line-height:1.25;color:var(--navy)}
.sh .t3{font-size:23px;font-weight:700;color:#333}
.sh .t3 span{font-family:'Noto Sans Gujarati',sans-serif;font-weight:700}
.sd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:#111;color:#fff;border-radius:8px;padding:8px 16px}
.sd b{font-size:30px;font-weight:800;line-height:1.15}
.sd i{font-style:normal;font-family:'Noto Sans Gujarati',sans-serif;font-size:26px;font-weight:700}
.sd .pg{font-size:18px;font-weight:700;opacity:.85;white-space:nowrap}
.sc{flex:1;min-height:0;display:flex;flex-direction:column;gap:.5em;overflow:hidden}
.sec{border:3px solid var(--navy);border-radius:12px;padding:.45em .7em .55em}
.sec.allow{background:#EAF1DD}.sec.info{background:#FFF2CC}.sec.warn{background:#FDE9D9;border-color:var(--red)}.sec.prog{background:#E4ECF7}
.sec .st{font-size:.6em;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);line-height:1.2}
.sec.warn .st{color:var(--red)}
.sec .st span{font-family:'Noto Sans Gujarati',sans-serif;text-transform:none;letter-spacing:0;margin-left:.5em;font-weight:800}
.it{margin-top:.45em;display:flex;flex-direction:column}
.it .en{font-weight:800;font-size:1em;line-height:1.2}
.it .gu{font-family:'Noto Sans Gujarati',sans-serif;font-weight:700;font-size:.9em;line-height:1.4}
.it.red .en,.it.red .gu{color:var(--red)}
.it .en:before{content:"\2022\00a0\00a0"}
.tm{display:grid;grid-template-columns:1fr 1fr;gap:.5em;margin-top:.1em}
.tm div{border:3px solid var(--red);border-radius:10px;background:#FDE9D9;padding:.3em .5em;text-align:center}
.tm .h{font-size:.5em;font-weight:900;color:var(--red);text-transform:uppercase;line-height:1.25}
.tm .h span{font-family:'Noto Sans Gujarati',sans-serif;text-transform:none;display:block}
.tm .v{font-size:1.55em;font-weight:900;line-height:1.1;color:#111}
.tm .vg{font-family:'Noto Sans Gujarati',sans-serif;font-size:1.2em;font-weight:800;line-height:1.3}
.tm .nt{grid-column:1/-1;font-size:.5em;font-weight:800;border:0;background:none;padding:0;color:var(--red)}
.sf{font-size:12px;color:#666;display:flex;justify-content:space-between}
.stage{position:fixed;left:-12000px;top:0;width:794px}
</style></head><body>
<main>
  <header>
    <div class="eyebrow">Aljamea-tus-Saifiyah · Surveillance</div>
    <h1>Gate Roster Desk</h1>
    <p class="lede">Pick the days and the gates. Download one PDF of big-print rosters in English and Gujarati, ready to hand to each gate keeper.</p>
  </header>

  <p class="msg" id="upd"></p>
  <section class="step" aria-labelledby="s1">
    <h2 id="s1">1. Days <small id="rng"></small></h2>
    <div class="chips" id="chips">
      <button class="chip" type="button" data-k="t1">Tomorrow</button>
      <button class="chip" type="button" data-k="t3">Next 3 days</button>
      <button class="chip" type="button" data-k="t7">Next 7 days</button>
    </div>
    <div class="dates">
      <div class="f"><label for="d1">From</label><input type="date" id="d1"></div>
      <div class="f"><label for="d2">To</label><input type="date" id="d2"></div>
    </div>
    <p class="msg" id="dmsg">Up to 7 days at a time.</p>
  </section>

  <section class="step" aria-labelledby="s2">
    <h2 id="s2">2. Gates <small id="gc"></small></h2>
    <div class="links"><button class="lk" type="button" id="all">Select all</button><button class="lk" type="button" id="none">Clear</button></div>
    <div class="gates" id="gates"></div>
    <div class="f"><label for="ord">Order of pages</label>
      <select id="ord"><option value="day">By day, then gate (hand out each morning)</option><option value="gate">By gate, then day</option></select></div>
  </section>

  <section class="step" aria-labelledby="s3">
    <h2 id="s3">3. Download</h2>
    <div class="sum">
      <div class="big" id="cnt"></div>
      <ul class="heads" id="heads"></ul>
    </div>
    <button class="btn" type="button" id="go">Download PDF</button>
    <div class="prog" id="pbar" hidden><i id="pfill"></i></div>
    <p class="msg" id="gmsg" role="status"></p>
    <div class="rd" id="rd" hidden></div>
  </section>

  <section class="step" aria-labelledby="s4">
    <h2 id="s4">Preview <small>Same pages as the PDF</small></h2>
    <div class="prev" id="prev"></div>
  </section>
</main>
<div class="stage" id="stage" aria-hidden="true"></div>

/* ---- helpers ---- */
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0)}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function fmtEn(d){return WD_EN[d.getDay()]+', '+d.getDate()+' '+MO_EN[d.getMonth()]+' '+d.getFullYear()}
function fmtGu(d){return WD_GU[d.getDay()]+', '+d.getDate()+' '+MO_GU[d.getMonth()]+' '+d.getFullYear()}
function short(d){return WD_EN[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MO_EN[d.getMonth()].slice(0,3)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ctx(d){return {d:d,iso:iso(d)}}
function g4(c){
  var o=null;G4_OVERRIDES.forEach(function(x){if(c.iso>=x.from&&c.iso<=x.to)o=x});
  if(o)return {ok:1,entry:o.entry,exit:o.exit,entryGu:o.entryGu,exitGu:o.exitGu,noteEn:o.noteEn,noteGu:o.noteGu};
  var s=G4_STD[c.d.getDay()];
  if(!s)return {ok:0,noteEn:'No standard Gate 4 timing is set for Sunday. Confirm with Tanzeem Office.',noteGu:'રવિવાર માટે ગેટ 4 નો સમય નક્કી નથી. તંઝીમ ઑફિસ પાસેથી ખાતરી કરવી.'};
  return {ok:1,entry:s[0],exit:s[1],entryGu:s[2],exitGu:s[3]};
}
function progsFor(c,gate){return PROGRAMS.filter(function(p){return p.gate===gate&&c.iso>=p.from&&c.iso<=p.to})}
function notesFor(c,gate){return NOTES.filter(function(n){return c.iso>=n.from&&c.iso<=n.to&&(n.gates==='all'||n.gates.indexOf(gate)>-1)})}
function prog(c,gate){
  var nt=notesFor(c,gate);
  var ns=nt.length?[S('warn',['NEW INSTRUCTION','નવી સૂચના'],nt.map(function(n){return {en:n.en,gu:n.gu,red:1}}))]:[];
  return ns.concat(progsFor(c,gate).map(function(p){
    var it=[[p.en,p.gu],['Time: '+p.time[0]+'  •  '+p.gateName[0]+'  •  '+p.people[0],'સમય: '+p.time[1]+'  •  '+p.gateName[1]+'  •  '+p.people[1]],['Entry pass: '+p.pass[0],'પ્રવેશ પાસ: '+p.pass[1]]];
    if(p.recv)it.push(['Received and authorised by: '+p.recv[0],'સ્વીકારનાર અને મંજૂર કરનાર: '+p.recv[1]]);
    return S('prog',['TODAY’S PROGRAM','આજનો કાર્યક્રમ'],it);
  }));
}
function itemHtml(x){
  var a=Array.isArray(x)?{en:x[0],gu:x[1]}:x;
  return '<div class="it'+(a.red?' red':'')+'"><div class="en">'+esc(a.en)+'</div><div class="gu">'+esc(a.gu)+'</div></div>';
}
function secHtml(s){
  if(s.kind==='tm'){
    var t=s.t;
    if(!t.ok)return '<div class="sec warn"><div class="st">GATE 4 TIMINGS <span>ગેટ 4 નો સમય</span></div>'+itemHtml([t.noteEn,t.noteGu])+'</div>';
    return '<div class="tm"><div><div class="h">Entry closes (for students)<span>પ્રવેશ બંધ (વિદ્યાર્થીઓ માટે)</span></div><div class="v">after '+esc(t.entry)+'</div><div class="vg">સવારે '+esc(t.entryGu)+' પછી</div></div>'+
      '<div><div class="h">Exit opens (for students)<span>બહાર નીકળવું શરૂ (વિદ્યાર્થીઓ માટે)</span></div><div class="v">'+esc(t.exit)+'</div><div class="vg">બપોરે '+esc(t.exitGu)+' થી</div></div>'+
      (t.noteEn?'<div class="nt">'+esc(t.noteEn)+' · '+esc(t.noteGu)+'</div>':'')+'</div>';
  }
  return '<div class="sec '+s.kind+'"><div class="st">'+esc(s.t[0])+'<span>'+esc(s.t[1])+'</span></div>'+s.items.map(itemHtml).join('')+'</div>';
}
function buildAll(days,gateIds,order){
  var pages=[];
  days.forEach(function(d,di){gateIds.forEach(function(gid,gi){
    var g=GATES.filter(function(x){return x.id===gid})[0];
    var ps=g.fn(ctx(d));
    ps.forEach(function(p,pi){pages.push({day:d,gate:g,page:p,n:pi+1,of:ps.length,key:iso(d)+'|'+gid+'|'+pi,di:di,gi:gi})});
  })});
  if(order==='gate')pages.sort(function(a,b){return a.gi-b.gi||a.di-b.di||a.n-b.n});
  return pages;
}
function sheetEl(pg,base){
  var p=pg.page,el=document.createElement('div');el.className='sheet';
  var sub=p.sub?'<div class="t3">'+esc(p.sub[0])+' <span>'+esc(p.sub[1])+'</span></div>':'';
  el.innerHTML='<div class="sh"><div class="t1">'+esc(p.t1)+'</div><div class="t2">'+esc(p.t2)+'</div>'+sub+'</div>'+
    '<div class="sd"><div><b>'+esc(fmtEn(pg.day))+'</b></div><i>'+esc(fmtGu(pg.day))+'</i>'+(pg.of>1?'<span class="pg">'+pg.n+' / '+pg.of+'</span>':'')+'</div>'+
    '<div class="sc">'+p.secs.map(secHtml).join('')+'</div><div class="sf"><span>Aljamea-tus-Saifiyah · Gate roster · Instructions as of '+esc(CFG.updated||'standard')+'</span><span>'+esc(pg.gate.name)+'</span></div>';
  el.querySelector('.sc').style.fontSize=base+'px';
  return el;
}
var FIT={};
function fit(el,key){
  var sc=el.querySelector('.sc'),b=36;
  for(;b>12;b--){sc.style.fontSize=b+'px';if(sc.scrollHeight<=sc.clientHeight+1)break}
  FIT[key]=b;return b;
}

/* ---- UI state ---- */
var $=function(i){return document.getElementById(i)};
var sel={};GATES.forEach(function(g){sel[g.id]=true});
function days(){
  var a=$('d1').value,b=$('d2').value;if(!a||!b)return [];
  var x=parse(a),y=parse(b),out=[];if(y<x)return [];
  while(x<=y&&out.length<7){out.push(x);x=addDays(x,1)}return out;
}
function chk(){
  var a=$('d1').value,b=$('d2').value,m=$('dmsg');m.className='msg';
  if(!a||!b){m.textContent='Choose both dates.';m.className='msg e';return false}
  var x=parse(a),y=parse(b);
  if(y<x){m.textContent='The last day is before the first day. Change one of them.';m.className='msg e';return false}
  var n=Math.round((y-x)/864e5)+1;
  if(n>7){m.textContent='That is '+n+' days. Only the first 7 will be used.'}else m.textContent=n+(n===1?' day':' days')+' selected.';
  return true;
}
function setRange(n){var t=addDays(new Date(),1);$('d1').value=iso(t);$('d2').value=iso(addDays(t,n-1))}
function chips(k){[].forEach.call(document.querySelectorAll('.chip'),function(c){c.setAttribute('aria-pressed',c.dataset.k===k?'true':'false')})}
function draw(){
  var ok=chk(),ds=ok?days():[],ids=GATES.filter(function(g){return sel[g.id]}).map(function(g){return g.id});
  $('gc').textContent=ids.length+' of '+GATES.length+' selected';
  $('rng').textContent=ds.length?(ds.length===1?short(ds[0]):short(ds[0])+' to '+short(ds[ds.length-1])):'';
  var pages=buildAll(ds,ids,$('ord').value);
  $('cnt').textContent=pages.length?(pages.length+(pages.length===1?' page':' pages')+' · '+ds.length+(ds.length===1?' day':' days')+' · '+ids.length+(ids.length===1?' gate':' gates')):'Nothing to download yet';
  $('go').disabled=!pages.length;
  var h=[];
  ds.forEach(function(d){
    var c=ctx(d),o=null;G4_OVERRIDES.forEach(function(x){if(c.iso>=x.from&&c.iso<=x.to)o=x});
    if(o&&sel.g4)h.push(['Gate 4 on '+short(d)+': entry closes '+o.entry+', exit opens '+o.exit+' ('+o.noteEn+')',0]);
    if(d.getDay()===0&&sel.g4)h.push(['Gate 4 on '+short(d)+' (Sunday): no standard timing is set. The page asks the gate keeper to confirm with Tanzeem Office.',1]);
    GATES.forEach(function(g){if(sel[g.id])notesFor(c,g.id).forEach(function(n){h.push([g.name+' on '+short(d)+': NEW INSTRUCTION: '+n.en,1])});if(sel[g.id])progsFor(c,g.id).forEach(function(p){h.push([g.name+' on '+short(d)+': '+p.en+', '+p.time[0],0])})});
  });
  $('heads').innerHTML=h.map(function(x){return '<li'+(x[1]?' class="w"':'')+'>'+esc(x[0])+'</li>'}).join('');
  $('heads').hidden=!h.length;
  // preview
  var pv=$('prev');pv.innerHTML='';
  if(!pages.length){pv.innerHTML='<p class="msg">Pick at least one day and one gate to see the pages.</p>';return pages}
  var W=340,scale=W/794;
  pages.forEach(function(pg){
    var box=document.createElement('div');box.className='pv';
    var lab=document.createElement('span');lab.textContent=short(pg.day)+' · '+pg.gate.name+(pg.of>1?' · page '+pg.n+' of '+pg.of:'');
    var w=document.createElement('div');w.className='pvw';w.style.width=W+'px';w.style.height=Math.round(1123*scale)+'px';w.style.maxWidth='100%';
    var inner=document.createElement('div');inner.className='pvi';inner.style.width='794px';inner.style.height='1123px';
    var el=sheetEl(pg,30);inner.appendChild(el);w.appendChild(inner);box.appendChild(lab);box.appendChild(w);pv.appendChild(box);
    fit(el,pg.key);
    inner.style.transform='scale('+scale+')';
  });
  // keep the preview narrower on small screens
  [].forEach.call(document.querySelectorAll('.pvw'),function(w){
    var cw=w.parentElement.clientWidth,s=Math.min(W,cw)/794;
    w.style.height=Math.round(1123*s)+'px';w.firstChild.style.transform='scale('+s+')';
  });
  return pages;
}

/* ---- PDF ---- */
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function make(){
  var gm=$('gmsg'),go=$('go'),pb=$('pbar'),pf=$('pfill'),rd=$('rd');
  gm.className='msg';gm.textContent='';rd.hidden=true;rd.innerHTML='';
  var ds=days(),ids=GATES.filter(function(g){return sel[g.id]}).map(function(g){return g.id});
  var pages=buildAll(ds,ids,$('ord').value);
  if(!pages.length||!window.html2canvas||!window.jspdf){gm.className='msg e';gm.textContent='The PDF tools did not load. Check your connection and reload the page.';return}
  go.disabled=true;pb.hidden=false;pf.style.width='0';
  try{
    try{await document.fonts.load('800 30px "Archivo"','A');await document.fonts.load('800 30px "Noto Sans Gujarati"','અ');await document.fonts.ready}catch(e){}
    var stage=$('stage');stage.innerHTML='';
    var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'}),imgs=[];
    for(var i=0;i<pages.length;i++){
      gm.textContent='Making page '+(i+1)+' of '+pages.length+'…';
      var el=sheetEl(pages[i],FIT[pages[i].key]||24);stage.innerHTML='';stage.appendChild(el);
      await wait(30);
      var cv=await window.html2canvas(el,{scale:1.7,backgroundColor:'#ffffff',logging:false,width:794,height:1123,windowWidth:794});
      var im=cv.toDataURL('image/jpeg',0.86);imgs.push(im);
      if(i)pdf.addPage();
      pdf.addImage(im,'JPEG',0,0,210,297,undefined,'FAST');
      pf.style.width=Math.round((i+1)/pages.length*100)+'%';
    }
    stage.innerHTML='';
    var blob=pdf.output('blob');
    var name='Gate_Rosters_'+iso(ds[0])+(ds.length>1?'_to_'+iso(ds[ds.length-1]):'')+'.pdf';
    var saved=false,why='';
    try{
      var u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(u)},60000);saved=true;
    }catch(e){why='The download did not start.'}
    if(saved){gm.className='msg o';gm.textContent='Downloaded '+name+' ('+pages.length+' pages). Check your Downloads folder.'}
    else{
      gm.className='msg e';gm.textContent=why+' The pages are shown below. Press and hold a page to save it as an image.';
      rd.hidden=false;rd.innerHTML=imgs.map(function(s,k){return '<img alt="Roster page '+(k+1)+'" src="'+s+'">'}).join('');
    }
  }catch(e){
    gm.className='msg e';gm.textContent='Could not make the PDF. Try fewer days or gates, then try again.';
  }
  go.disabled=false;pb.hidden=true;
}

});
$('all').addEventListener('click',function(){GATES.forEach(function(g){sel[g.id]=true;$('g_'+g.id).checked=true});draw()});
$('none').addEventListener('click',function(){GATES.forEach(function(g){sel[g.id]=false;$('g_'+g.id).checked=false});draw()});
[].forEach.call(document.querySelectorAll('.chip'),function(c){c.addEventListener('click',function(){setRange(c.dataset.k==='t1'?1:c.dataset.k==='t3'?3:7);chips(c.dataset.k);draw()})});
$('d1').addEventListener('change',function(){chips('');if($('d2').value<$('d1').value)$('d2').value=$('d1').value;draw()});
$('d2').addEventListener('change',function(){chips('');draw()});
$('ord').addEventListener('change',draw);
$('go').addEventListener('click',make);
$('upd').textContent=CFG.updated?'Timings and instructions last updated: '+CFG.updated:'Using standard timings. No special instructions loaded.';
setRange(1);chips('t1');
var ready=function(){draw()};
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('800 30px "Archivo"','A'),document.fonts.load('800 30px "Noto Sans Gujarati"','અ')]).then(ready,ready);draw()}else draw();
</script>
