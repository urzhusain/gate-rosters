<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchman · Aljamea-tus-Saifiyah</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1F3A5F">
<meta property="og:title" content="Watchman contact · Aljamea-tus-Saifiyah"><meta property="og:description" content="Name, photo and phone of the watchman on duty.">
<link rel="icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#F4F4F1;--fg:#16191E;--mute:#5B616A;--line:#D8D7D0;--card:#fff;--navy:#1F3A5F;--gold:#F2B84B;--grn:#166534}
@media (prefers-color-scheme:dark){:root{--bg:#12151A;--fg:#ECEBE6;--mute:#A0A5AD;--line:#2D3138;--card:#1A1E24;--navy:#8FB4E3;--grn:#86EFAC}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 'Public Sans',system-ui,sans-serif}
.top{background:#1F3A5F;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 var(--gold)}
.top img{height:34px}.top b{display:block;font-size:16px}.top small{opacity:.85;font-size:12.5px}
main{max-width:420px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ph{width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);background:var(--line)}
h1{margin:14px 0 4px;font-size:24px}.m{color:var(--mute);font-size:14px}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
a.b{display:block;text-decoration:none;font-weight:800;border-radius:12px;padding:13px;margin-top:10px;font-size:17px}
a.c{background:#1F3A5F;color:#fff}a.w{background:#1f8f4e;color:#fff}
.err{color:#B91C1C;font-weight:700}
</style></head><body>
<div class="top"><img src="../assets/logo-white.png" alt=""><div><b>Security Control</b><small>Aljamea-tus-Saifiyah</small></div></div>
<main><div class="card" id="c"><div class="m">Loading…</div></div>
<p class="m" style="text-align:center;margin-top:14px">Watchman contact card, shared by the Aljamea security office.</p></main>
<script src="config.js"></script>
<script>
(function(){
  var c=document.getElementById('c'),t=new URLSearchParams(location.search).get('t')||'';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
  if(!t){c.innerHTML='<div class="err">This link is not valid.</div>';return}
  fetch(SUP_CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'card',t:t})}).then(function(r){return r.json()}).then(function(r){
    if(!r.ok){c.innerHTML='<div class="err">'+esc(r.error||'Not found')+'</div>';return}
    var g=r.card,d=String(g.phone||'').replace(/\D/g,''),n=d.length===10?'91'+d:d;
    document.title=g.name+' · Watchman';
    c.innerHTML=(g.photo?'<img class="ph" alt="'+esc(g.name)+'" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(g.photo)+'&sz=w600">':'<div class="ph" style="margin:0 auto"></div>')+
      '<h1>'+esc(g.name)+'</h1><div class="m">Watchman</div><div class="chips">'+(g.post?'<span>'+esc(g.post)+'</span>':'')+(g.shift?'<span>'+esc(g.shift)+' shift</span>':'')+(g.agency?'<span>'+esc(g.agency)+'</span>':'')+'</div>'+
      (n?'<div style="font-size:20px;font-weight:800">+'+esc(n)+'</div><a class="b c" href="tel:+'+n+'">Call</a><a class="b w" href="https://wa.me/'+n+'" target="_blank" rel="noopener">WhatsApp</a>':'<div class="m">No phone number saved.</div>');
  }).catch(function(){c.innerHTML='<div class="err">No connection. Try again.</div>'});
})();
</script>
</body></html>
