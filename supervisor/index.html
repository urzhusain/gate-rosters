<style>

*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f);padding-bottom:84px}

.logo-d{display:none}
@media (prefers-color-scheme:dark){.logo-l{display:none}.logo-d{display:inline-block}}

<script>
var API=(window.SUP_CONFIG||{}).apiUrl||'';
var S={pin:'',name:'',role:'',posts:[],guards:[],overdue:24,tab:'',issues:null,checks:null,shift:'',filter:'',busy:false};
var CAMCAT='Suspicious activity (seen on camera)';
var INFOCAT='Information (event notice)';
var INFOLBL={Open:'New',Acknowledged:'Noted','In progress':'Informed',Solved:'Planned'};
function vis(l){return S.role==='supervisor'?l.filter(function(i){return i.category!==CAMCAT&&i.category!==INFOCAT}):l}
var CATS=[INFOCAT,'Guard absent','Guard sleeping / away from post','Security breach','Suspicious activity (seen on camera)','Visitor or entry problem','Gate pass / material','Camera / equipment','Cleanliness / maintenance','Other'];
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function newestFirst(r){try{if(r&&r.ok){var k=function(x){return String(x||'')};if(r.issues)r.issues.sort(function(a,b){return k(b.created).localeCompare(k(a.created))});if(r.checks)r.checks.sort(function(a,b){return k(b.time).localeCompare(k(a.time))});if(r.checkpoints)r.checkpoints.sort(function(a,b){return a.date===b.date?k(b.from).localeCompare(k(a.from)):k(b.date).localeCompare(k(a.date))})}}catch(e){}return r}
function call(action,data){
  if(!API)return Promise.resolve({ok:false,error:'The app is not connected yet. Setup is pending.'});
  var body=JSON.stringify(Object.assign({action:action,pin:S.pin,by:S.name},data||{}));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}).then(function(r){return r.json()}).then(newestFirst).catch(function(){return {ok:false,error:'No connection. Check your internet and try again.'}});
}
function nowIST(){return new Date()}
function parseT(s){return new Date(String(s).replace(' ','T')+'+05:30')}
function ageH(s){return (Date.now()-parseT(s).getTime())/36e5}
function ageTxt(s){var h=ageH(s);if(h<1)return Math.max(1,Math.round(h*60))+' min';if(h<48)return Math.round(h)+' h';return Math.round(h/24)+' days'}
function ymd(offset){var d=new Date(Date.now()+5.5*36e5+offset*864e5);return d.toISOString().slice(0,10)}
function nowMin(){var t=new Date(Date.now()+5.5*36e5);return t.getUTCHours()*60+t.getUTCMinutes()}
function outsideShiftC(sh,x){if(sh==='Day')return x>=1260||x<420;if(sh==='Night')return x>=540&&x<1140;return false}
function hhmm(x){return ('0'+Math.floor(x/60)).slice(-2)+':'+('0'+x%60).slice(-2)}
function defShift(){var h=new Date().getHours();return (h>=8&&h<20)?'Day':'Night'}
function thumb(id,sz){return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+(sz||600)}
function gInfo(id){return (S.guards||[]).filter(function(g){return g.id===id})[0]||{}}
function phoneLinks(ph){var d=String(ph||'').replace(/\D/g,'');if(!d)return '<span class="muted">no number</span>';var n=d.length===10?'91'+d:d;return '<a href="tel:+'+n+'">📞 '+esc(ph)+'</a> · <a href="https://wa.me/'+n+'" target="_blank" rel="noopener">WhatsApp</a>'}
function miniPh(id,sz){return id?'<a href="'+full(id)+'" target="_blank" rel="noopener"><img alt="" src="'+thumb(id,200)+'" style="width:'+(sz||56)+'px;height:'+(sz||56)+'px;object-fit:cover;border-radius:8px;border:1px solid var(--line);vertical-align:middle"></a>':''}
function gx(c){var g=gInfo(c.guardId);return '<div style="display:flex;gap:8px;align-items:center;margin-top:4px">'+miniPh(c.photo||g.photo)+'<span style="font-size:13px">'+(g.phone?phoneLinks(g.phone):'')+'</span></div>'}
function full(id){return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'}
function compress(file){return new Promise(function(res){
  if(!file)return res('');
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){try{var m=1000,s=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);var o=c.toDataURL('image/jpeg',0.68);URL.revokeObjectURL(u);res(o)}catch(e){res('')}};
  im.onerror=function(){URL.revokeObjectURL(u);res('')};im.src=u})}

/* ---------- in-page camera: keeps the browser open (no jump to the phone's camera app) ---------- */
(function(){
  var busy=false;
  document.addEventListener('click',function(e){
    var el=e.target;if(!el||el.tagName!=='INPUT'||el.type!=='file'||!el.hasAttribute('capture'))return;
    if(el.dataset.native==='1'){el.dataset.native='';return}
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){return}
    e.preventDefault();if(busy)return;busy=true;
    var facing=el.getAttribute('capture')==='user'?'user':'environment';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column';
    d.innerHTML='<video playsinline muted autoplay style="flex:1;min-height:0;width:100%;object-fit:cover;background:#000"></video><div style="display:flex;gap:12px;justify-content:center;align-items:center;padding:16px;background:#000"><button type="button" id="cmx" style="padding:12px 18px;border-radius:10px;border:1px solid #888;background:#222;color:#fff;font-size:16px">Cancel</button><button type="button" id="cms" aria-label="Take photo" style="width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#e53935"></button><button type="button" id="cmn" style="padding:12px 18px;border-radius:10px;border:1px solid #888;background:#222;color:#fff;font-size:16px">Phone camera</button></div>';
    document.body.appendChild(d);
    var v=d.querySelector('video'),st=null;
    function close(){try{st&&st.getTracks().forEach(function(t){t.stop()})}catch(x){}d.remove();busy=false}
    function native(){close();el.dataset.native='1';el.click()}
    d.querySelector('#cmx').onclick=close;d.querySelector('#cmn').onclick=native;
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:960}},audio:false}).then(function(s){
      st=s;v.srcObject=s;v.play&&v.play();
      d.querySelector('#cms').onclick=function(){
        if(!v.videoWidth){return}
        var m=1280,k=Math.min(1,m/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        c.toBlob(function(b){if(!b){native();return}
          try{var f=new File([b],'photo.jpg',{type:'image/jpeg',lastModified:Date.now()}),dt=new DataTransfer();dt.items.add(f);el.files=dt.files;el.dispatchEvent(new Event('change',{bubbles:true}));el.dispatchEvent(new Event('input',{bubbles:true}))}catch(x){close();el.dataset.native='1';el.click();return}
          close()},'image/jpeg',0.8)}
    }).catch(function(){native()});
  },true);
})();

/* ---------- paste a screenshot (computer) ---------- */
(function(){
  var pc=window.matchMedia&&matchMedia('(pointer:fine)').matches&&!('ontouchstart' in window);
  function vis(el){return el&&el.offsetParent!==null}
  function target(){var l=[].slice.call(document.querySelectorAll('input[type=file][accept^="image"]')).filter(vis);return l[l.length-1]||null}
  document.addEventListener('paste',function(e){
    var el=target();if(!el||!e.clipboardData)return;
    var it=[].slice.call(e.clipboardData.items||[]).filter(function(i){return i.kind==='file'&&/^image\//.test(i.type)})[0];if(!it)return;
    var b=it.getAsFile();if(!b)return;e.preventDefault();
    try{var f=new File([b],'screenshot.png',{type:b.type||'image/png',lastModified:Date.now()}),dt=new DataTransfer();dt.items.add(f);el.files=dt.files;el.dispatchEvent(new Event('change',{bubbles:true}));toast('Screenshot added')}catch(x){toast('Could not paste. Use Choose file.')}
  });
  if(!pc)return;
  new MutationObserver(function(){
    [].forEach.call(document.querySelectorAll('input[type=file][accept^="image"]:not([data-ph])'),function(el){
      el.setAttribute('data-ph','1');var h=document.createElement('small');h.className='muted';h.style.display='block';h.style.marginTop='4px';
      h.textContent='On a computer: press Windows + Shift + S, select the camera screen, then press Ctrl + V here. On a phone, this opens the camera.';
      el.insertAdjacentElement('afterend',h);
    });
  }).observe(document.documentElement,{childList:true,subtree:true});
})();

/* ---------- On duty now (watchmen, supervisor, Control Room) ---------- */
var CARD_URL='https://urzhusain.github.io/gate-rosters/supervisor/card.html?t=';
function shareGuard(g){
  var url=CARD_URL+encodeURIComponent(g.share),txt=g.name+(g.post?' · '+g.post:'')+(g.shift?' ('+g.shift+' shift)':'')+'\n'+url;
  if(navigator.share){navigator.share({title:g.name,text:g.name+(g.post?' · '+g.post:''),url:url}).catch(function(){});return}
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener');
}
function openOnDuty(){
  var sh=defShift(),now=new Date(),P=(window.SUP_CONFIG||{}).profiles||{},cw=(window.SUP_CONFIG||{}).controlWhatsapp;
  var d=modal('<h2>On duty now · '+sh+' shift</h2><div id="odl" class="muted">Loading…</div><button class="btn o" id="odx">Close</button>');
  $('#odx',d).onclick=function(){d.remove()};
  var staff=function(k,role,ph){var p=P[k];if(!p)return '';return '<div class="card" style="flex-direction:row;align-items:center;gap:12px;padding:10px"><img src="'+esc(p.photo)+'" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)"><div><b>'+esc(p.name)+'</b><div class="muted" style="font-size:13px">'+esc(role)+'</div>'+(ph?'<div style="font-size:14px">'+phoneLinks(ph)+'</div>':'')+'</div></div>'};
  Promise.all([call('bootstrap'),call('checks',{from:ymd(-1),to:ymd(0)})]).then(function(rs){
    if(rs[0].ok&&rs[0].guards)S.guards=rs[0].guards;
    var cs=rs[1].ok?rs[1].checks:[];
    var st=new Date(now);if(sh==='Day'){st.setHours(8,0,0,0)}else{if(now.getHours()<8)st.setDate(st.getDate()-1);st.setHours(20,0,0,0)}
    var inShift=cs.filter(function(c){return c.shift===sh&&parseT(c.time)>=st&&c.presence!=='Absent'});
    var html=staff('supervisor','Supervisor','')+staff('control','Control Room',cw)+
      '<div class="muted" style="font-size:13px">Seen = checked on post this shift. Roster = expected, not checked yet. Tap Share to send a watchman\'s card (name, photo, phone) as a link.</div>';
    html+=(S.posts||[]).map(function(p){
      var seen={},rows=[];
      inShift.filter(function(c){return c.post===p}).forEach(function(c){if(!c.guardId||seen[c.guardId])return;seen[c.guardId]=1;var g=gInfo(c.guardId);rows.push({g:g.id?g:{name:c.guard,phone:'',photo:c.photo},how:'Seen '+String(c.time).slice(11,16)+(c.role==='control'?' (Control Room)':''),ok:1})});

  listModal2('Supervisor rounds',(l.length?l.map(function(r){return '<div style="border-top:1px solid var(--line);padding:8px 0"><div class="row" style="justify-content:space-between;gap:8px"><span><b>'+esc(r.name)+'</b><br><small class="muted">'+(r.date===t?'Today ':'Yesterday ')+esc(r.from)+' to '+esc(r.to)+(r.status==='upcoming'?'':' · '+r.done+' of '+r.total+' gates checked')+'</small></span>'+rChip(r)+'</div>'+(r.status!=='upcoming'&&r.missing.length?'<small class="muted">Not checked: '+esc(r.missing.join(', '))+'</small>':'')+'</div>'}).join(''):'<div class="muted">No supervisor rounds yet.</div>')+'<div class="muted" style="margin-top:6px">See each gate check and its photo in Today by gate.</div>')}

  var t=ymd(0),y=ymd(-1),mine=list.filter(function(r){return r.date===t||(r.date===y&&r.role==='control'&&r.status!=='upcoming')});
  var miss=mine.filter(function(r){return r.status==='missed'&&r.date===t||(r.status==='missed'&&r.date===y)}).length,open=mine.filter(function(r){return r.status==='open'})[0],today=list.filter(function(r){return r.date===t}),done=today.filter(function(r){return r.status==='done'}).length;
  return {miss:miss,open:open,done:done,total:today.length}}
function ntile(key,label,count,sub,tone,badge){return '<button type="button" class="nt '+(tone||'')+'" data-n="'+key+'">'+(badge?'<span class="nb">'+badge+'</span>':'')+'<span class="nl">'+esc(label)+'</span><span class="nc">'+count+'</span><span class="ns">'+esc(sub||'')+'</span></button>'}
function listModal2(title,html){var d=modal('<h2>'+esc(title)+'</h2>'+html+'<button class="btn o" id="lx">Close</button>');$('#lx',d).onclick=function(){d.remove()};return d}
function viewHome(){

        (todo.length?'<div class="muted">Still to check:</div><div class="row">'+todo.slice(0,6).map(function(p){return '<button class="chip yel" style="border:0;font:inherit;font-weight:800" data-chk="'+esc(p)+'">'+esc(p)+'</button>'}).join('')+(todo.length>6?'<span class="muted">+'+(todo.length-6)+' more</span>':'')+'</div>':'<div class="flag ok">All gates checked this shift.</div>')+
        '<div class="row"><button class="btn s" data-tab-go="round">Start round</button><button class="btn o s" data-tab-go="raise">Raise issue</button></div></div>'+'<div class="ng">'+(rs[2]&&rs[2].ok?(function(){var st=roundStats(rs[2].rounds);S.homeData={rounds:rs[2].rounds,mine:mine};return ntile('rounds','Rounds',st.open?'Open':(st.miss?st.miss:st.done+'/'+st.total),st.open?st.open.name:(st.miss?'missed':'done today'),st.miss?'red':(st.open?'yel':'grn'))})():'')+ntile('mine','My open issues',mine.length,mine.length?'tap to see':'all solved',mine.length?'yel':'grn')+(rs[4]&&rs[4].ok?(function(){var due=cpDue(rs[4].checkpoints);S.homeData.cp=1;return ntile('cp','Checkpoints',due.length,due.length?'to confirm now':'nothing due',due.length?'yel':'grn')})():'')+'</div>'+rosterCard();
    }else if(S.role==='control'){
      var un=openI.filter(function(i){return i.status==='Open'}),urg=openI.filter(function(i){return i.priority==='Urgent'});

      var rall=rs[2]&&rs[2].ok?rs[2].rounds:[],rl=rall.filter(function(r){return r.role==='control'}),srl=rall.filter(function(r){return r.role==='supervisor'}),st=roundStats(rl),sst=roundStats(srl),cpl=rs[4]&&rs[4].ok?rs[4].checkpoints:[],cpMiss=cpl.filter(function(c){return c.date===ymd(0)&&(c.status==='missed'||c.status==='problem')}).length,nl=noticeList(all),newNote=nl.filter(function(i){return i.status==='Open'}).length;
      var seen=store('alerts_seen_control')||'',newAl=al.filter(function(a){return a.time>seen}).length,hiAl=al.filter(function(a){return a.time>seen&&a.level==='high'}).length;
      var miss=S.posts.filter(function(p){return !cur[p]}),urgN=openI.filter(function(i){return i.priority==='Urgent'}).length;
      S.homeData={al:al,rounds:rl,srounds:srl,warn:warn,miss:miss,sh:sh,nd:nd,nn:nn};
      html+='<div class="ng">'+
        ntile('notices','Head Office instructions',nl.length,nl.length?(newNote?newNote+' not yet noted':'in progress'):'nothing pending',newNote?'red':(nl.length?'yel':'grn'),newNote?'NEW':'')+
        ntile('alerts','Alerts',newAl,newAl?'new to review · '+al.length+' in all':al.length+' in all, all reviewed',hiAl?'red':(newAl?'yel':'grn'),hiAl?hiAl+' important':'')+
        ntile('rounds','Rounds',st.open?'Open':(st.miss?st.miss:st.done+'/'+st.total),st.open?st.open.name:(st.miss?'missed':'done today'),st.miss?'red':(st.open?'yel':'grn'))+
        ntile('srounds','Supervisor rounds',sst.open?'Open':(sst.miss?sst.miss:sst.done+'/'+sst.total),sst.open?sst.open.name+' · '+sst.open.done+' of '+sst.open.total+' gates':(sst.miss?'missed today':'done today'),sst.miss?'red':(sst.open?'yel':'grn'))+
        ntile('new','Not acknowledged',un.length,un.length?'issues waiting for you':'all acknowledged',un.length?'red':'grn')+
        ntile('open','Open issues',openI.length,urgN?urgN+' urgent':'none urgent',urgN?'red':(openI.length?'yel':'grn'))+
        ntile('overdue','Overdue',od.length,'unsolved over '+S.overdue+' h',od.length?'red':'grn')+
        ntile('gates','Gates not checked',miss.length,sh+' shift · '+(S.posts.length-miss.length)+' of '+S.posts.length+' done',miss.length?'yel':'grn')+
        ntile('warn','Warnings today',warn.length,'absent, double duty, new faces',warn.length?'red':'grn')+
        (rs[4]&&rs[4].ok?(function(){var due=cpDue(rs[4].checkpoints);return ntile('cp','Checkpoints',due.length,cpMiss?cpMiss+' missed or problem today (register photos incl.)':(due.length?'to confirm now':'nothing due · tap to see photos'),cpMiss?'red':(due.length?'yel':'grn'),cpMiss?'MISSED':'')})():'')+
        '</div><div class="row"><button class="btn o s" data-tab-go="issues">All issues</button><button class="btn o s" data-tab-go="today">Today by gate</button><button class="btn o s" data-tab-go="guards">Guards</button><button class="btn o s" data-tab-go="raise">Raise issue</button></div>'+rosterCard();

      var by=function(list){var o={};list.forEach(function(c){o[c.post]=(o[c.post]||0)+1});return Object.keys(o).map(function(k){return [k,o[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,6)};

        '<div class="card"><b>Absences by gate (7 days)</b>'+(ab.length?bars(by(ab),'red'):'<div class="muted">None.</div>')+'</div>'+
        '<div class="card"><b>Coverage today</b>'+covLine('Day',nd,S.posts.length)+covLine('Night',nn,S.posts.length)+'</div>'+rosterCard()+
        '<div class="row"><button class="btn o s" data-tab-go="report">Gate report</button><button class="btn o s" data-tab-go="today">Today by gate</button><button class="btn o s" data-tab-go="guards">Guards</button><button class="btn o s" data-tab-go="raise">Raise issue</button></div>';
    }
    $('#hm').outerHTML='<div id="hm" style="display:flex;flex-direction:column;gap:12px">'+html+'</div>';
    var root=$('#hm');goBtns(root);fillGateInstr();
    var H=S.homeData||{},goI=function(f){S.filter=f;S.icat=null;S.idays=7;S.tab='issues';main()};
    var NT={
      notices:openNotices,
      alerts:function(){openAlerts(H.al||[])},
      rounds:function(){openRounds(H.rounds||[])},
      srounds:function(){openSupRounds(H.srounds||[])},
      cp:function(){openCheckpoints(function(){viewHome()})},
      new:function(){goI('new')},open:function(){goI('open')},overdue:function(){goI('overdue')},
      mine:function(){var l=H.mine||[];listModal2('My open issues ('+l.length+')',l.length?l.map(issueLine).join(''):'<div class="flag ok">None. Everything you raised is solved.</div>').querySelectorAll('[data-issue]').forEach(function(b){b.onclick=function(){openIssue(b.dataset.issue)}})},
