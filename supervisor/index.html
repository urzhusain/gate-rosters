<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security Control</title>
<meta name="theme-color" content="#1F3A5F">
<meta name="description" content="Rounds, issues and gate reports for the Aljamea-tus-Saifiyah Control Room.">
<meta property="og:type" content="website"><meta property="og:title" content="Security Control · Aljamea-tus-Saifiyah"><meta property="og:description" content="Rounds, issues and gate reports for the Control Room.">
<meta property="og:image" content="https://urzhusain.github.io/gate-rosters/supervisor/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="https://urzhusain.github.io/gate-rosters/supervisor/"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../assets/icon-180.png"><link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F4F4F1;--fg:#16191E;--mute:#5B616A;--line:#D8D7D0;--card:#fff;--navy:#1F3A5F;--on:#fff;--gold:#F2B84B;--red:#B91C1C;--redbg:#FDE9D9;--grn:#166534;--grnbg:#E4F2E4;--yel:#8A5A00;--yelbg:#FFF2CC;--blu:#1E4E8C;--blubg:#E4ECF7;
 --f:'Public Sans','Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#12151A;--fg:#ECEBE6;--mute:#A0A5AD;--line:#2D3138;--card:#1A1E24;--navy:#8FB4E3;--on:#10141A;--gold:#F2B84B;--red:#FCA5A5;--redbg:#3A1D1D;--grn:#86EFAC;--grnbg:#16301F;--yel:#FCD34D;--yelbg:#3A2F10;--blu:#93C5FD;--blubg:#1A2635;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f);padding-bottom:84px}
.top{background:var(--navy);color:var(--on);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top b{font-weight:800;font-size:17px}.top small{display:block;opacity:.85;font-size:12.5px}
.top button{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
h2{margin:4px 0 0;font-size:20px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
label{font-weight:700;font-size:14px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:12px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.btn{font:inherit;font-weight:800;font-size:16px;border-radius:10px;padding:14px 16px;border:2px solid var(--navy);background:var(--navy);color:var(--on);cursor:pointer;width:100%}
.btn.s{width:auto;padding:9px 14px;font-size:14px}.btn.o{background:transparent;color:var(--navy)}.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.g{background:var(--grn);border-color:var(--grn);color:var(--bg)}
.btn[disabled]{opacity:.5}
.seg{display:flex;border:2px solid var(--navy);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:700;padding:11px;border:0;background:transparent;color:var(--navy)}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--on)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:6}
.nav button{flex:1;font:inherit;font-size:12.5px;font-weight:700;background:none;border:0;padding:10px 4px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button[aria-current=true]{color:var(--navy);box-shadow:inset 0 3px 0 var(--navy)}
.nav i{font-style:normal;font-size:20px;line-height:1}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--blubg);color:var(--blu)}
.chip.red{background:var(--redbg);color:var(--red)}.chip.grn{background:var(--grnbg);color:var(--grn)}.chip.yel{background:var(--yelbg);color:var(--yel)}
.post{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;color:var(--fg)}
.post b{font-size:16.5px}.post small{color:var(--mute);display:block}
.post.done{border-color:var(--grn)}
.flag{padding:9px 11px;border-radius:9px;font-size:14px;font-weight:600;background:var(--redbg);color:var(--red)}
.flag.ok{background:var(--grnbg);color:var(--grn)}.flag.info{background:var(--yelbg);color:var(--yel)}
.muted{color:var(--mute);font-size:14px}
.err{color:var(--red);font-weight:700;font-size:14px}
img.th{width:100%;max-height:260px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.log{border-left:3px solid var(--line);padding-left:10px;font-size:13.5px;color:var(--mute)}
.log b{color:var(--fg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;z-index:30;max-width:90%;text-align:center}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.gu{font-family:'Noto Sans Gujarati',var(--f)}
/* look and feel */
body{background:radial-gradient(1200px 400px at 50% -120px,rgba(31,58,95,.10),transparent 70%) no-repeat,var(--bg)}
.top{box-shadow:0 3px 0 var(--gold),0 6px 18px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:38px;width:auto;flex:none}
.brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0;border-left:1.5px solid rgba(255,255,255,.35);padding-left:12px}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(31,58,95,.07);border-radius:14px}
h2{color:var(--navy);letter-spacing:-.01em}
.btn{box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(1px);box-shadow:none}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--navy)}
.post{box-shadow:0 1px 2px rgba(0,0,0,.04);border-left:6px solid var(--line)}
.post.done{border-left-color:var(--grn)}
.post:active{transform:scale(.995)}
.nav{box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px 4px;text-align:center}
.hero img{width:min(300px,72%);height:auto}
.hero h1{margin:6px 0 0;font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.hero p{margin:0;color:var(--mute);font-size:14px}
.logo-d{display:none}
@media (prefers-color-scheme:dark){.logo-l{display:none}.logo-d{display:inline-block}}
</style></head><body>
<div id="app"></div>
<script>document.write('<script src="config.js?t='+Date.now()+'"><\/script><script src="../config.js?t='+Date.now()+'"><\/script>')</script>
<script>
var API=(window.SUP_CONFIG||{}).apiUrl||'';
var S={pin:'',name:'',role:'',posts:[],guards:[],overdue:24,tab:'',issues:null,checks:null,shift:'',filter:'',busy:false};
var CAMCAT='Suspicious activity (seen on camera)';
function vis(l){return S.role==='supervisor'?l.filter(function(i){return i.category!==CAMCAT}):l}
var CATS=['Guard absent','Guard sleeping / away from post','Security breach','Suspicious activity (seen on camera)','Visitor or entry problem','Gate pass / material','Camera / equipment','Cleanliness / maintenance','Other'];
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function call(action,data){
  if(!API)return Promise.resolve({ok:false,error:'The app is not connected yet. Setup is pending.'});
  var body=JSON.stringify(Object.assign({action:action,pin:S.pin,by:S.name},data||{}));
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}).then(function(r){return r.json()}).catch(function(){return {ok:false,error:'No connection. Check your internet and try again.'}});
}
function nowIST(){return new Date()}
function parseT(s){return new Date(String(s).replace(' ','T')+'+05:30')}
function ageH(s){return (Date.now()-parseT(s).getTime())/36e5}
function ageTxt(s){var h=ageH(s);if(h<1)return Math.max(1,Math.round(h*60))+' min';if(h<48)return Math.round(h)+' h';return Math.round(h/24)+' days'}
function ymd(offset){var d=new Date(Date.now()+5.5*36e5+offset*864e5);return d.toISOString().slice(0,10)}
function nowMin(){var t=new Date(Date.now()+5.5*36e5);return t.getUTCHours()*60+t.getUTCMinutes()}
function outsideShiftC(sh,x){if(sh==='Day')return x>=1260||x<420;if(sh==='Night')return x>=540&&x<1140;return false}
function hhmm(x){return ('0'+Math.floor(x/60)).slice(-2)+':'+('0'+x%60).slice(-2)}
function defShift(){var h=new Date().getHours();return (h>=8&&h<20)?'Day':'Night'}
function thumb(id,sz){return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+(sz||600)}
function gInfo(id){return (S.guards||[]).filter(function(g){return g.id===id})[0]||{}}
function phoneLinks(ph){var d=String(ph||'').replace(/\D/g,'');if(!d)return '<span class="muted">no number</span>';var n=d.length===10?'91'+d:d;return '<a href="tel:+'+n+'">📞 '+esc(ph)+'</a> · <a href="https://wa.me/'+n+'" target="_blank" rel="noopener">WhatsApp</a>'}
function miniPh(id,sz){return id?'<a href="'+full(id)+'" target="_blank" rel="noopener"><img alt="" src="'+thumb(id,200)+'" style="width:'+(sz||56)+'px;height:'+(sz||56)+'px;object-fit:cover;border-radius:8px;border:1px solid var(--line);vertical-align:middle"></a>':''}
function gx(c){var g=gInfo(c.guardId);return '<div style="display:flex;gap:8px;align-items:center;margin-top:4px">'+miniPh(c.photo||g.photo)+'<span style="font-size:13px">'+(g.phone?phoneLinks(g.phone):'')+'</span></div>'}
function full(id){return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'}
function compress(file){return new Promise(function(res){
  if(!file)return res('');
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.68))};im.onerror=function(){res('')};im.src=r.result};r.onerror=function(){res('')};r.readAsDataURL(file)})}

/* ---------- login ---------- */
function viewLogin(msg){
  $('#app').innerHTML='<main><div class="hero"><img class="logo-l" src="../assets/logo.png" alt="Siyanat Al Mumtalakat"><img class="logo-d" src="../assets/logo-white.png" alt="Siyanat Al Mumtalakat"><h1>Security Control</h1><p>Aljamea-tus-Saifiyah</p></div><div class="card"><h2>Sign in</h2>'+
  '<div class="f"><label for="pn">Your personal PIN</label><input id="pn" type="password" inputmode="numeric" autocomplete="current-password" value="'+esc(store('pin')||'')+'"></div>'+
  '<div class="err" id="le">'+esc(msg||'')+'</div><button class="btn" id="lg">Sign in</button></div></main>';
  $('#lg').onclick=function(){
    var p=$('#pn').value.trim();
    if(!p){$('#le').textContent='Enter your PIN.';return}
    S.pin=p;$('#lg').disabled=true;$('#lg').textContent='Checking…';
    call('bootstrap').then(function(r){
      if(!r.ok){S.pin='';viewLogin(r.error);return}
      store('pin',p);S.name=r.name;S.role=r.role;S.posts=r.posts;S.guards=r.guards;S.overdue=r.overdueHours;S.minCover=r.minCover;
      S.shift=defShift();S.tab='home';S.filter=r.role==='head'?'overdue':'open';
      main()})};
}
function logout(){S.pin='';S.role='';store('pin','');viewLogin()}

/* ---------- shell ---------- */
function tabsFor(){
  if(S.role==='control')return [['home','🏠','Home'],['issues','📋','Issues'],['raise','📹','Camera'],['round','🚶','Round'],['report','📊','Report'],['roster','🗓️','Roster']];
  if(S.role==='head')return [['home','🏠','Home'],['issues','📋','Issues'],['report','📊','Report'],['roster','🗓️','Roster']];
  return [['home','🏠','Home'],['round','🚶','Round'],['raise','➕','Raise'],['issues','📋','Issues'],['roster','🗓️','Roster']];}
function roleName(){return {supervisor:'Supervisor',control:'Control Room',head:'Head Office'}[S.role]}
function main(){
  var tabs=tabsFor();
  $('#app').innerHTML='<div class="top"><div class="brand"><img src="../assets/logo-white.png" alt="Siyanat Al Mumtalakat"><div><b>Security Control</b><small>'+(S.name===roleName()?esc(S.name):esc(S.name)+' · '+roleName())+'</small></div></div><button id="lo">Sign out</button></div><main id="mn"></main>'+
   '<nav class="nav">'+tabs.map(function(t){return '<button data-tab="'+t[0]+'" aria-current="'+(S.tab===t[0])+'"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join('')+'</nav>';
  $('#lo').onclick=logout;
  [].forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.onclick=function(){S.tab=b.dataset.tab;main()}});
  var v={home:viewHome,issues:viewIssues,round:viewRound,raise:viewRaise,today:viewToday,report:viewReport,guards:viewGuards,roster:viewRoster}[S.tab];$('#mn').classList.remove('wide');v();
}

/* ---------- round ---------- */
function viewRound(){
  var m=$('#mn');
  m.innerHTML='<h2>Round</h2><div class="seg" id="sg"><button data-s="Day" aria-pressed="'+(S.shift==='Day')+'">Day</button><button data-s="Night" aria-pressed="'+(S.shift==='Night')+'">Night</button></div><div id="pl" class="muted">Loading…</div>';
  [].forEach.call(m.querySelectorAll('[data-s]'),function(b){b.onclick=function(){S.shift=b.dataset.s;viewRound()}});
  loadChecks().then(function(){
    var done={};(S.checks||[]).filter(function(c){return c.shift===S.shift}).forEach(function(c){done[c.post]=(done[c.post]||0)+1});
    var dbl={};(S.checks||[]).filter(function(c){return /DOUBLE/.test(c.flags)}).forEach(function(c){dbl[c.post]=1});
    var n=Object.keys(done).length;
    $('#pl').outerHTML='<div class="muted" id="pl">'+n+' of '+S.posts.length+' posts checked this '+S.shift.toLowerCase()+' shift. Tap a post to record.</div>'+
     S.posts.map(function(p){return '<button class="post'+(done[p]?' done':'')+'" data-p="'+esc(p)+'"><span><b>'+esc(p)+'</b><small>'+(done[p]?done[p]+' check'+(done[p]>1?'s':'')+' recorded':'Not checked yet')+'</small></span><span>'+(dbl[p]?'<span class="chip red">⚠ Double duty</span> ':'')+'<span class="chip '+(done[p]?'grn':'yel')+'">'+(done[p]?'✓':'Check')+'</span></span></button>'}).join('');
    [].forEach.call(m.querySelectorAll('[data-p]'),function(b){b.onclick=function(){openCheck(b.dataset.p)}});
  });
}
function loadChecks(from,to){return call('checks',{from:from||ymd(0),to:to||from||ymd(0)}).then(function(r){if(r.ok)S.checks=r.checks;else toast(r.error);return r})}
function modal(html){var d=document.createElement('div');d.className='modal';d.innerHTML='<div class="sheet">'+html+'</div>';d.onclick=function(e){if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function openCheck(post){
  var gs=S.guards.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  var d=modal('<h2>'+esc(post)+' · '+S.shift+'</h2>'+
  '<div class="f"><label>Guard on post</label><select id="gd"><option value="">— choose —</option>'+gs.map(function(g){return '<option value="'+esc(g.id)+'">'+esc(g.name)+(g.shift?' · '+g.shift:'')+'</option>'}).join('')+'<option value="__new">+ New guard (register)</option></select></div>'+
  '<div id="ng" hidden class="card"><b>Register new guard</b><div class="f"><label>Full name</label><input id="gn"></div><div class="f"><label>Phone</label><input id="gp" type="tel" inputmode="tel"></div><div class="f"><label>Shift</label><select id="gsh"><option value="Day">Day (8 AM to 8 PM)</option><option value="Night">Night (8 PM to 8 AM)</option></select></div><div class="f"><label>Agency</label><select id="gag"><option value="Sainik">Sainik</option><option value="Avenger">Avenger</option></select></div><div class="f"><label>Photo of the guard (take it now with the camera)</label><input id="gf" type="file" accept="image/*" capture="user"></div><button class="btn o s" id="gs">Save guard</button><div id="gst" class="flag info" hidden></div></div>'+
  '<div class="f"><label>Presence</label><select id="pr"><option>Present</option><option>Late</option><option>Absent</option></select></div>'+
  '<div class="f"><label>Type of duty</label><select id="ty"><option value="Regular">Regular guard</option><option value="Temporary">Temporary replacement</option><option value="Permanent">Permanent replacement</option><option value="Rotation">Rotation (moved by agency)</option></select></div>'+
  '<div class="f" id="rl" hidden><label id="rll"></label><input id="rv"></div>'+
  '<div class="f"><label id="phl">'+(S.role==='supervisor'?'Photo at the post (required, take it now with the camera)':'Camera screenshot (optional)')+'</label><input id="ph" type="file" accept="image/*" capture="environment"></div><div id="lc" class="muted"></div>'+
  '<div class="f"><label>Remark (optional)</label><textarea id="rm"></textarea></div><div class="err" id="ce"></div>'+
  '<button class="btn" id="sv">Save check</button><button class="btn o" id="cn">Cancel</button>');
  $('#cn',d).onclick=function(){d.remove()};
  var loc=null,locSt='';
  if(S.role==='supervisor'){
    if(!navigator.geolocation){locSt='fail';$('#lc',d).innerHTML='<span class="err">📍 This phone cannot share location. The scan will be flagged.</span>'}
    else{locSt='wait';$('#lc',d).textContent='📍 Getting your location…';
      navigator.geolocation.getCurrentPosition(function(p){loc={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};locSt='ok';$('#lc',d).textContent='📍 Location ready (accurate to about '+Math.round(p.coords.accuracy)+' m)'},
        function(){locSt='fail';$('#lc',d).innerHTML='<span class="err">📍 Location is off. Allow location for this site, or the scan will be flagged.</span>'},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
  }
  $('#pr',d).onchange=function(){if(S.role==='supervisor')$('#phl',d).textContent=this.value==='Absent'?'Photo of the empty post (optional)':'Photo at the post (required, take it now with the camera)'};
  $('#gd',d).onchange=function(){
    $('#ng',d).hidden=this.value!=='__new';
    var w=$('#dw',d),g=gInfo(this.value);
    if(!w){w=document.createElement('div');w.id='dw';this.parentNode.appendChild(w)}
    w.innerHTML=(g.id&&g.shift&&outsideShiftC(g.shift,nowMin()))?'<div class="flag" style="margin-top:8px">⚠ Possible double duty: '+esc(g.name)+' is registered for the <b>'+esc(g.shift)+'</b> shift, but it is '+hhmm(nowMin())+' now. Ask him, and tell the Control Room.</div>':(g.id&&!g.shift?'<div class="flag info" style="margin-top:8px">This guard has no shift set yet. Ask the Control Room to set it.</div>':'');
  };
  $('#ty',d).onchange=function(){var t=this.value,r=$('#rl',d);r.hidden=t==='Regular';$('#rll',d).textContent=t==='Rotation'?'Moved from which post?':'Replacing whom? (name)'};
  $('#gs',d).onclick=function(){
    var b=this,st=$('#gst',d);
    var nm=$('#gn',d).value.trim();
    st.className='flag info';st.hidden=false;
    if(nm.length<3){st.className='flag';st.textContent='Write the guard\'s full name first.';return}
    b.disabled=true;b.textContent='Saving…';st.textContent='Saving the guard, please wait a few seconds…';
    var gf=$('#gf',d).files[0];
    if(S.role==='supervisor'&&!gf){b.disabled=false;b.textContent='Save guard';st.className='flag';st.textContent='Take a photo of the guard with the camera first.';return}
    if(gf&&gf.lastModified&&Date.now()-gf.lastModified>10*60000){b.disabled=false;b.textContent='Save guard';st.className='flag';st.textContent='That photo is old. Take a new photo of the guard now.';return}
    compress(gf).then(function(img){return call('addGuard',{name:nm,phone:$('#gp',d).value,shift:$('#gsh',d).value,agency:$('#gag',d).value,post:post,photo:img})}).then(function(r){
      b.disabled=false;b.textContent='Save guard';
      if(!r.ok){st.className='flag';st.textContent=r.error||'Could not save. Try again.';return}

      var todo=S.posts.filter(function(p){return !cur[p]}),mine=openI.filter(function(i){return i.raisedBy===S.name});
      html+='<div class="card"><b>Round progress · '+sh+' shift</b>'+covLine(sh+' shift',S.posts.length-todo.length,S.posts.length)+
        (todo.length?'<div class="muted">Still to check:</div><div class="row">'+todo.slice(0,6).map(function(p){return '<button class="chip yel" style="border:0;font:inherit;font-weight:800" data-chk="'+esc(p)+'">'+esc(p)+'</button>'}).join('')+(todo.length>6?'<span class="muted">+'+(todo.length-6)+' more</span>':'')+'</div>':'<div class="flag ok">All gates checked this shift.</div>')+
        '<div class="row"><button class="btn s" data-tab-go="round">Start round</button><button class="btn o s" data-tab-go="raise">Raise issue</button></div></div>'+(rs[2]&&rs[2].ok?roundsCard(rs[2].rounds):'')+
        '<div class="card"><b>My open issues ('+mine.length+')</b>'+(mine.length?mine.slice(0,4).map(issueLine).join(''):'<div class="muted">None. Everything you raised is solved.</div>')+'</div>'+rosterCard();
    }else if(S.role==='control'){
      var un=openI.filter(function(i){return i.status==='Open'}),urg=openI.filter(function(i){return i.priority==='Urgent'});
      var al=rs[3]&&rs[3].ok?rs[3].alerts:[];S.alerts=al;
      html+=alertsCard(al)+(rs[2]&&rs[2].ok?roundsCard(rs[2].rounds):'')+'<div class="row">'+tile('Open issues',openI.length)+tile('Overdue',od.length,od.length?'err':'')+'</div><div class="row">'+tile('Not acknowledged',un.length,un.length?'err':'')+tile('Urgent',urg.length,urg.length?'err':'')+'</div>'+
        '<div class="card"><b>Needs action now</b>'+((un.concat(od.filter(function(i){return un.indexOf(i)<0}))).slice(0,5).map(issueLine).join('')||'<div class="muted">Nothing waiting.</div>')+'<button class="btn o s" data-tab-go="issues">All issues</button></div>'+
        '<div class="card"><b>Coverage today</b>'+covLine('Day',nd,S.posts.length)+covLine('Night',nn,S.posts.length)+(S.posts.filter(function(p){return !cur[p]}).length?'<div class="muted">Not yet checked ('+sh.toLowerCase()+'): '+esc(S.posts.filter(function(p){return !cur[p]}).join(', '))+'</div>':'')+'<button class="btn o s" data-tab-go="today">See today by gate</button><button class="btn o s" data-tab-go="guards">Guards</button></div>'+
        '<div class="card"><b>Warnings today ('+warn.length+')</b>'+(warn.length?warn.slice(0,6).map(function(c){return '<div class="flag">'+esc(c.post)+' · '+c.shift+' · '+esc(c.guard||'no guard')+'<br>'+esc(c.flags)+'</div>'}).join(''):'<div class="muted">No warnings today.</div>')+'</div>'+rosterCard();
    }else{
      var wc=rs[2].ok?rs[2].checks:[],ab=wc.filter(function(c){return c.presence==='Absent'}),db=wc.filter(function(c){return /DOUBLE/.test(c.flags)});
      var by=function(list){var o={};list.forEach(function(c){o[c.post]=(o[c.post]||0)+1});return Object.keys(o).map(function(k){return [k,o[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,6)};
      var og={};openI.forEach(function(i){og[i.post]=(og[i.post]||0)+1});var ogl=Object.keys(og).map(function(k){return [k,og[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,6);
      html+='<div class="row">'+tile('Overdue issues',od.length,od.length?'err':'')+tile('Open issues',openI.length)+'</div><div class="row">'+tile('Absent, last 7 days',ab.length,ab.length?'err':'')+tile('Double duty, 7 days',db.length,db.length?'err':'')+'</div>'+
        '<div class="card"><b>Unsolved for more than '+S.overdue+' hours</b>'+(od.length?od.slice(0,6).map(issueLine).join('')+'<div class="muted">Tap an issue to ask the Control Room why it is not solved.</div>':'<div class="flag ok">Nothing overdue.</div>')+'</div>'+
        '<div class="card"><b>Open issues by gate</b>'+(ogl.length?bars(ogl,'red'):'<div class="muted">None.</div>')+'</div>'+
        '<div class="card"><b>Absences by gate (7 days)</b>'+(ab.length?bars(by(ab),'red'):'<div class="muted">None.</div>')+'</div>'+
        '<div class="card"><b>Coverage today</b>'+covLine('Day',nd,S.posts.length)+covLine('Night',nn,S.posts.length)+'</div>'+rosterCard()+
        '<div class="row"><button class="btn o s" data-tab-go="report">Gate report</button><button class="btn o s" data-tab-go="today">Today by gate</button><button class="btn o s" data-tab-go="guards">Guards</button><button class="btn o s" data-tab-go="raise">Raise issue</button></div>';
    }
    $('#hm').outerHTML='<div id="hm" style="display:flex;flex-direction:column;gap:12px">'+html+'</div>';
    var root=$('#hm');goBtns(root);fillGateInstr();if(S.role==='control')wireAlerts(root,S.alerts||[]);
    [].forEach.call(root.querySelectorAll('[data-chk]'),function(b){b.onclick=function(){S.shift=sh;openCheck(b.dataset.chk)}});
  });
}
function viewRoster(){
  $('#mn').innerHTML='<div class="row" style="justify-content:space-between"><h2>Roster</h2><a class="btn o s" style="text-decoration:none" href="../" target="_blank" rel="noopener">Open full page</a></div><div class="muted">Pick days and gates, then Download PDF.</div><iframe src="../?v='+Date.now()+'" title="Gate rosters" style="width:100%;height:calc(100vh - 230px);min-height:480px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>';
}

/* ---------- start ---------- */
if(store('pin')&&store('name')&&API){S.pin=store('pin');S.name=store('name');viewLogin();$('#lg').click()}else viewLogin(API?'':'Not connected yet. Setup is pending.');
